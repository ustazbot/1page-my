name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy 1page.my
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # No checkout needed — all work runs directly on VPS via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 161.97.108.141
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Starting deployment ==="

            cd /var/www/1page-my

            echo "--- git pull ---"
            git pull origin main

            echo "--- npm ci ---"
            npm ci --production=false

            echo "--- npm run build ---"
            npm run build

            echo "--- pm2 restart ---"
            pm2 restart 1page-my

            echo "--- verify ---"
            pm2 status 1page-my

            echo "=== Deployment complete ==="
